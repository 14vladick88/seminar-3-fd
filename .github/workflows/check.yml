name: Проверка заданий

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seminar-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.title }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - task: task01
            title: '01 · Два разряда'
          - task: task02
            title: '02 · Биты чётности'
          - task: task03
            title: '03 · Проездной'
          - task: task04
            title: '04 · Доставка'
          - task: task05
            title: '05 · Уведомления (дополнительно)'
    steps:
      - name: Получить код
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Установить JDK 26
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: '26'
          cache: gradle
      - name: Проверить решение
        id: tests
        run: |
          if bash ./gradlew :${{ matrix.task }}:test --console=plain --no-daemon; then
            echo "exit_code=0" >> "$GITHUB_OUTPUT"
          else
            echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          fi
      - name: Показать результаты
        if: always()
        env:
          TEST_EXIT_CODE: ${{ steps.tests.outputs.exit_code }}
        run: python3 .github/scripts/summary.py ${{ matrix.task }}
      - name: Сохранить HTML и XML отчёты
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: report-${{ matrix.task }}
          path: |
            ${{ matrix.task }}/build/reports/tests/test/
            ${{ matrix.task }}/build/test-results/test/*.xml
          if-no-files-found: ignore
          retention-days: 14
